version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: optica_postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root_password_secure
      POSTGRES_DB: optica_erp
    ports:
      - "5432:5432"
    volumes:
      - optica_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d optica_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: optica_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - optica_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  optica_db_data:
  optica_redis_data: